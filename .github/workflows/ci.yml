name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [gfortran-serial, gfortran-openmp, gfortran-mpi]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe for version stamping

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libblas-dev libhdf5-dev
          if [ "${{ matrix.preset }}" = "gfortran-mpi" ]; then
            sudo apt-get install -y libopenmpi-dev openmpi-bin
          fi

      - name: Install Python test deps
        run: pip install numpy h5py

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j

      - name: Test (smoke + statistical regression + harness self-test)
        env:
          # allow 2 MPI ranks on the 2-core public runners
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: ctest --preset ${{ matrix.preset }}

      - name: Threaded regression (nomp=2)
        if: matrix.preset == 'gfortran-openmp'
        run: |
          BUILD=build/${{ matrix.preset }}
          rm -rf $BUILD/smoke_run_omp2 && mkdir -p $BUILD/smoke_run_omp2
          cd $BUILD/smoke_run_omp2
          ln -s $GITHUB_WORKSPACE/data/* .
          ln -s $GITHUB_WORKSPACE/tests/cases/w7/* .
          ln -sf input_w7.str input.str
          sed 's/ in_nomp = 1/ in_nomp = 2/' $GITHUB_WORKSPACE/tests/cases/w7/input.par.lte > input.par
          ../superlite | tee stdout.log
          grep -q "SuperLite finished" stdout.log
          cd $GITHUB_WORKSPACE
          python tests/regression/compare.py $BUILD/smoke_run_omp2 -v

      - name: Benchmark (reduced smoke case, OpenMP scaling)
        if: matrix.preset == 'gfortran-openmp'
        run: |
          echo '### Benchmark (n2s=17)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 tools/hyperlite_tools/bench.py \
            --exe build/${{ matrix.preset }}/superlite --nomp 1,2 --n2s 17 \
            | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-outputs-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/smoke_run*/output.*
          if-no-files-found: ignore

  tools:
    name: hyperlite-tools (uv + ruff + ty + console scripts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install package (locked)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (ty)
        run: uv run ty check

      - name: Console scripts respond
        run: |
          uv run sgfilter --help
          uv run wlgenadd --help
          uv run stella2superlite --help
          uv run parse-hdf5-sndata --help
          uv run python -c "import hyperlite_tools.myfuncts"

      - name: pip install path still works (Gate 2)
        working-directory: .
        run: |
          python3 -m venv /tmp/pipenv
          /tmp/pipenv/bin/pip install -q -e tools/
          /tmp/pipenv/bin/sgfilter --help

  ifx:
    name: ifx-release (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Intel oneAPI Fortran
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-fortran liblapack-dev libblas-dev

      - name: Configure and build
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --preset ifx-release
          cmake --build --preset ifx-release -j
