site_name: hyperlite
site_description: >-
  SuperLite/hyperlite — IMC-DDMC Monte Carlo radiation transport for
  interacting supernovae
site_url: https://tkillestein.github.io/hyperlite/
repo_url: https://github.com/tkillestein/hyperlite
repo_name: tkillestein/hyperlite
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - User guide:
      - Building: building.md
      - Running a simulation: running.md
      - Python tools: tools.md
  - Reference:
      - Physics overview: physics.md
      - I/O schema: io-schema.md
      - Migration (ASCII to HDF5): migration.md
  - Development:
      - Developer guide: developer.md
      - Changelog: changelog.md
